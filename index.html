<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutPredi - Predicciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>FutPredi</h1>
            <p>Predice. Compite. Demuestra cuánto sabes.</p>
        </div>
    </header>

    <main class="container">
        <div class="section-header">
            <h2>🏆 Temporada actual</h2>
            <p class="subtitle">Desliza para predecir el rendimiento de cada jugador (0 a 10).</p>
        </div>
        
        <!-- Tarjetas generadas por JS -->
        <div id="players-container"></div>
    </main>

    <!-- Contenedor para avisos flotantes -->
    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
